name: Update Channels
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch current playlist from Gist
        run: |
          curl -sL "https://gist.githubusercontent.com/rzrb0/${{ secrets.GIST_ID }}/raw/channels.m3u" -o channels.m3u
          echo "File scaricato."

      - name: Install Python dependencies
        run: pip install requests

      - name: Update playlist
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python get_lc.py

      - name: Deploy playlist to Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.GIST_ID }}
          file_path: channels.m3u
          file_type: text
